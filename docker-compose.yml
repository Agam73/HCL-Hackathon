# Local stack for RetailPulse AI.
# AI service and Postgres are defined now. Express and React can be
# added here when those packages exist — do not invent placeholder apps.
#
# Prerequisite: Docker Desktop (Windows). This file is not required to
# run the AI service against a separately installed PostgreSQL instance.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: retailpulse
      POSTGRES_USER: retailpulse
      POSTGRES_PASSWORD: retailpulse
    # Bind to localhost only so the DB is not advertised on the LAN.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - retailpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailpulse -d retailpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ./ai-service
    environment:
      DATABASE_URL: postgresql://retailpulse:retailpulse@postgres:5432/retailpulse
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:-dev-ai-service-key}
      CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-mock}
      CHAT_MODEL_NAME: ${CHAT_MODEL_NAME:-mock-chat}
      EMBEDDING_MODEL_PROVIDER: ${EMBEDDING_MODEL_PROVIDER:-mock}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-mock-embed}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      ENABLE_RETRIEVE_DEBUG: ${ENABLE_RETRIEVE_DEBUG:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  retailpulse_pgdata:
