[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-ai-service"
version = "0.1.0"
description = "RetailPulse AI RAG microservice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "psycopg[binary,pool]>=3.2.0",
  "pgvector>=0.3.0",
  "httpx>=0.27.0",
  "pypdf>=4.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "fpdf2>=2.7.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that need PostgreSQL with pgvector",
]
